<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página 1</title>
    <script>
      function cambioPagina(url, reemplazar = false) {
        if (url === "" || url === null || url === undefined) {
          console.log("URL no válida: no se cambia de página");
          return;
        }

        if (reemplazar) {
          window.location.replace(url);
        } else {
          window.location.assign(url);
        }
      }
    </script>
  </head>
  <body>
    <h1>Página 1</h1>
    <button onclick="cambioPagina('pagina2.html')">
      Ir a página 2 (normal)
    </button>
    <button onclick="cambioPagina('pagina2.html', true)">
      Ir a página 2 (reemplazando)
    </button>
    <button onclick="cambioPagina('')">Probar con cadena vacía</button>
  </body>
</html>
