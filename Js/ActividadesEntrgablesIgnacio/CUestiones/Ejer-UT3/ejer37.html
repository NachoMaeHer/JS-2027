    <script>
      function contaVisitas() {
        let contadorVisitas = sessionStorage.getItem("visitas");

        if (contadorVisitas == null) {
          contadorVisitas = 0;
        }

        contadorVisitas++;

        localStorage.setItem("visitas", contadorVisitas);

        return contadorVisitas;
      }

      function contarVisitasSesion() {
